[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybridrag"
version = "0.1.0"
description = "Hybrid RAG (dense + lexical + RRF fusion) on a single PostgreSQL store."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
hybridrag-migrate = "hybridrag.db.migrate:run"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "testcontainers>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hybridrag"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# asyncpg ships no py.typed marker: treat its API as untyped (Any) rather
# than failing on the import. Library-by-library policy, not a global ignore.
module = "asyncpg"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
