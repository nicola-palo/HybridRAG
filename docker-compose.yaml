services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RAG_DB_USER:?RAG_DB_USER missing - copy .env.example to .env}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?RAG_DB_PASSWORD missing - copy .env.example to .env}
      POSTGRES_DB: ${RAG_DB_NAME:?RAG_DB_NAME missing - copy .env.example to .env}
    ports:
      - "${RAG_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
